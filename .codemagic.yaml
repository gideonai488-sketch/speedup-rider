workflows:
  android-build:
    name: Android Build
    environment:
      vars:
        CM_KEYSTORE: 
        CM_KEYSTORE_PASSWORD: c3BlZWR1cDEyMw==
        CM_KEY_ALIAS: c3BlZWR1cC1hbGlhcw==
        CM_KEY_PASSWORD: c3BlZWR1cDEyMw==
      android:
        api_level: 34
        build_tools: 34.0.0
      node:
        version: 20

    trigger:
      branch:
        - main

    scripts:
      - name: Install dependencies
        script: |
          npm install -g pnpm
          pnpm install

      - name: Build web assets
        script: |
          pnpm run build

      - name: Add Android platform and sync Capacitor
        script: |
          npx cap add android
          npx cap sync android

      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > android/app/speedup.keystore

      - name: Build Android app
        script: |
          cd android
          ./gradlew bundleRelease

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
