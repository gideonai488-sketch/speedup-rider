workflows:
  speedup-android:
    name: SpeedUp Android AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 17
      groups:
        - app_credentials
        - environment variables
      vars:
        PACKAGE_NAME: "com.speedup.riders"
    scripts:
      - name: Install dependencies
        script: |
          npm install -g pnpm
          pnpm install
      - name: Set up environment
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> .env
      - name: Build web assets
        script: pnpm run build
      - name: Sync Android platform
        script: npx cap sync android
      - name: Set up Android signing
        script: |
          if [ ! -z "$CM_KEYSTORE" ]; then
            echo $CM_KEYSTORE | base64 --decode > android/app/speedup.keystore
          else
            keytool -genkeypair -v \
              -keystore android/app/speedup.keystore \
              -alias speedup-alias \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass speedup123 -keypass speedup123 \
              -dname "CN=SpeedUp, OU=Mobile, O=SpeedUp, L=Accra, ST=Greater Accra, C=GH"
          fi
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk

  speedup-ios:
    name: SpeedUp iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: SpeedUp
    environment:
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.speedup.riders
      groups:
        - app_store_connect
        - environment variables
      vars:
        PACKAGE_NAME: "com.speedup.riders"
    scripts:
      - name: Install dependencies
        script: |
          npm install -g pnpm
          pnpm install
      - name: Set up environment
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> .env
      - name: Build web assets
        script: pnpm run build
      - name: Sync iOS platform
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa
    artifacts:
      - ios/App/build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
