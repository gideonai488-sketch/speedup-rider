workflows:
  speedup-rider-android:
    name: SpeedUp Rider - Android AAB
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
      vars:
        PACKAGE_NAME: "com.speedup.riders"
        CM_KEYSTORE: 
        CM_KEYSTORE_PASSWORD: c3BlZWR1cDEyMw==
        CM_KEY_ALIAS: c3BlZWR1cC1hbGlhcw==
        CM_KEY_PASSWORD: c3BlZWR1cDEyMw==
        VITE_SUPABASE_URL: "https://stvceqozldcoeaotsinf.supabase.co"
        VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0dmNlcW96bGRjb2Vhb3RzaW5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMzE3MDEsImV4cCI6MjA5MTkwNzcwMX0.qol8622T19ociEFEWqQfaeDjiAfH5tmSW6yw9actXlM"
        VITE_PAYSTACK_PUBLIC_KEY: "pk_live_671fccd651daf066804466572cfd0b7c47df2471"
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Set up environment
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> .env
          echo "VITE_PAYSTACK_PUBLIC_KEY=$VITE_PAYSTACK_PUBLIC_KEY" >> .env
      - name: Build web assets
        script: npm run build
      - name: Sync Android platform
        script: npx cap sync android
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > android/app/speedup-rider.keystore
      - name: Build Android AAB
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=app/speedup-rider.keystore \
            -Pandroid.injected.signing.store.password=$(echo $CM_KEYSTORE_PASSWORD | base64 --decode) \
            -Pandroid.injected.signing.key.alias=$(echo $CM_KEY_ALIAS | base64 --decode) \
            -Pandroid.injected.signing.key.password=$(echo $CM_KEY_PASSWORD | base64 --decode)
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - gideonai488@gmail.com
        notify:
          success: true
          failure: true

  speedup-rider-ios:
    name: SpeedUp Rider - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: SpeedUp
    environment:
      node: 20
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.speedup.riders
      vars:
        PACKAGE_NAME: "com.speedup.riders"
        VITE_SUPABASE_URL: "https://stvceqozldcoeaotsinf.supabase.co"
        VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0dmNlcW96bGRjb2Vhb3RzaW5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzMzE3MDEsImV4cCI6MjA5MTkwNzcwMX0.qol8622T19ociEFEWqQfaeDjiAfH5tmSW6yw9actXlM"
        VITE_PAYSTACK_PUBLIC_KEY: "pk_live_671fccd651daf066804466572cfd0b7c47df2471"
    scripts:
      - name: Install dependencies
        script: npm install --legacy-peer-deps
      - name: Set up environment
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> .env
          echo "VITE_PAYSTACK_PUBLIC_KEY=$VITE_PAYSTACK_PUBLIC_KEY" >> .env
      - name: Build web assets
        script: npm run build
      - name: Sync iOS platform
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS IPA
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa
    artifacts:
      - ios/App/build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - gideonai488@gmail.com
        notify:
          success: true
          failure: true
