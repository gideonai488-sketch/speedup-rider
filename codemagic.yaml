workflows:
  speedup-android:
    name: SpeedUp Android
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 18
      java: 17
      groups:

        - app_credentials   # KEYSTORE (base64), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
        - environment       # VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
      vars:
        PACKAGE_NAME: "com.speedup.riders"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Set up environment
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> .env
      - name: Build web assets
        script: npm run build
      - name: Add Android platform
        script: npx cap sync android
      - name: Set up Android signing
        script: |
          if [ ! -z "$KEYSTORE" ]; then
            echo $KEYSTORE | base64 --decode > android/app/keystore.jks
            cat > android/key.properties <<EOF
          storeFile=keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          fi
      - name: Build Android
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab


  speedup-ios:
    name: SpeedUp iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: SpeedUp
    environment:
      node: 18
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.speedup.riders
      groups:
        - app_store_connect  # APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY
        - environment        # VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY
      vars:
        PACKAGE_NAME: "com.speedup.riders"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Set up environment
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" >> .env
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY" >> .env
      - name: Build web assets
        script: npm run build
      - name: Add iOS platform
        script: npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath build/ipa
    artifacts:
      - ios/App/build/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
